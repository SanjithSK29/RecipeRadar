services:
  reciperadar:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - recipe-data:/app/data
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
volumes:
  recipe-data:
  qdrant-data:
